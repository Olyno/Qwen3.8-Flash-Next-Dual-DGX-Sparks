# msi auto-heal layer 2: turn silent hangs into loud reboots.
# GB10 unified-memory thrash presents as RCU stalls / soft lockups with the
# kernel still half-alive; these knobs make it panic instead of suffering,
# then reboot itself after 15 s.
# install: sudo cp 90-autoheal.conf /etc/sysctl.d/ && sudo sysctl -p /etc/sysctl.d/90-autoheal.conf
kernel.panic                        = 15
kernel.panic_on_rcu_stall           = 1
kernel.softlockup_panic             = 1
kernel.hardlockup_panic             = 1
kernel.watchdog_thresh              = 30
# Reboot on kernel oops too (some allocator BUG()s oops without panicking):
kernel.panic_on_oops                = 1
