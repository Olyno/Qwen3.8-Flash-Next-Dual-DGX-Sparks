# recipes/prod.conf — the daily-driver product recipe (data only, no logic).
# LOCKED PRODUCT (user, 2026-09-27): lean thinking-changes checkpoint +
# best-of-everything-else = q38-lean-hyb x K6 x MTP5 sampled/block/no-drop x
# PLE mmap x fp8 KV on vLLM v0.30.
# STATUS: lean quality gates PASSED (GPQA +5.6 pp, ~10-16 % fewer thinking
# tokens); hybrid PASSED (+60-68 % speed, GPQA +4.1 pp) — both measured on the
# old image, same bench protocol. v0.30 speed rows (arm A4 below) + gpqa200
# confirmation are PENDING the first clean v0.30 boot; run arm-a4 as the
# prod-confirm before trusting this file's numbers.
#
# PINS (tests/recipe_lint.sh enforces): IMAGE image@sha256 + CKPT_SHA256.
# IMAGE DIGEST CAPTURED 09-27 17:2x from msi: docker image inspect vllm/vllm-openai:v0.30.0 ->
# vllm/vllm-openai:v0.30.0 (the floating tag rode through 8 crash triages).
IMAGE="vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90"
IMAGE_HINT="vllm/vllm-openai:v0.30.0"

# Local bench-built checkpoint (lean x hybrid NVFP4+FP8-dense, 120 GiB, built
# + verified 09-27: quant parity q38-hyb, 591 FP8_PER_CHANNEL_PER_TOKEN).
# MODEL_PATH wins over MODEL_ID in start.sh; hub id stays for the sha record.
MODEL_PATH="$HOME/models/q38-lean-hyb"
MODEL_ID="local/q38-lean-hyb"
CKPT_SHA256="29f10c2c7dc6d2a50b4a758432527ed98a3016639695b761183f92770b04ca54"  # fingerprint: sha256 over sorted (shard,size,mtime) of the q38-lean-hyb index, msi 09-27 17:3x (NOT content-hash; see note below)

CONTAINER="vllm-fn-prod"
PORT=8888                 # safe only while comfy-h3.service is disabled
MASTER_PORT=50000

# -- memory shaping (engine/budget.sh) -----------------------------------------
PLE_GIB=47.68             # packed fp8 PLE table size (nvfp4-wk1 lineage)
MTP_WEIGHTS_GIB=2.34      # draft weights credited when MTP off (here: on)
KV_CACHE_DTYPE=fp8_e4m3   # needs files/patch_qsa_fp8_kv_v030.py (PR #55557)
MAX_MODEL_LEN=131072
MTP_NUM_SPECULATIVE_TOKENS=5

# -- PLE + engine deltas (engine/ple.sh, start.sh) ----------------------------
PLE_MODE=mmap             # proven contract: lazy build once, reuse forever
FP8DENSE=1                # hybrid ckpt needs the 3-file overlay (files/*.py)

# -- watchdog -----------------------------------------------------------------
MEMWATCH_MIN_GIB=3
MEMWATCH_MIN_FREE_GIB=1

# -- vLLM args ----------------------------------------------------------------
VLLM_ARGS="--served-model-name qwen3.8-flash-next --max-num-seqs 8 --max-num-batched-tokens 8192 --safetensors-load-strategy lazy --enable-chunked-prefill --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --distributed-executor-backend mp --quantization modelopt"
NUM_EXPERTS_PER_TOK=6
PLE_EMBEDDING_DTYPE=float8_e4m3fn
HF_OVERRIDES="{\"text_config\": {\"ple_embedding_dtype\": \"$PLE_EMBEDDING_DTYPE\", \"num_experts_per_tok\": $NUM_EXPERTS_PER_TOK}}"
COMPILATION_CONFIG="{\"mode\":0,\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}"
# disable_eagle_block_drop: NATIVE in v0.30 (speculative.py:440), TTFT -50 %.
# use_local_argmax_reduction must NOT combine with sampled drafting (PR #71).
SPECULATIVE_CONFIG="{\"method\":\"mtp\",\"num_speculative_tokens\":5,\"draft_sample_method\":\"probabilistic\",\"rejection_sample_method\":\"block\",\"disable_eagle_block_drop\":true}"
EXTRA_VLLM_ARGS=""
DOCKER_ARGS_EXTRA=""
