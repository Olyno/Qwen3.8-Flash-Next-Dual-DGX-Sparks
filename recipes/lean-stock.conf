# recipes/lean-stock.conf — the checkpoint that ALREADY lives on the gx10 pair
# (~/models/Qwen3.8-Flash-Next-NVFP4-lean, the 09-23 λ=2.0 lean bake of the
# stock nvidia NVFP4 body, K10-native). Serves the dual pair with zero new
# disk: both nodes already hold it (the old flow rsync'd it).
# Differences vs prod.conf/pair.conf:
#   FP8DENSE unset — this is the STOCK quantization (no FP8_PER_CHANNEL_PER_
#     TOKEN in the index; the fp8dense overlay would be wrong here)
#   NUM_EXPERTS_PER_TOK=6 — the adopted K6 override (config native is 10; K6
#     quality-gate verified on this lineage, docs/verdicts)
#   MTP k=4 — engine-legality (ring/block divisibility, see pair.conf note)
# The measured PRODUCT (q38-lean-hyb, FP8-dense) is NOT this checkpoint: it is
# +60-68 % speed and +4.1 pp GPQA on top of lean. It needs 120 GiB that the
# gx10 head does not have free (105 G as of 09-28 04:20) — see README
# "Memory model" + ./stop.sh; ship it when disk allows:
#   rsync -aH msi:~/models/q38-lean-hyb ~/models/   # over LAN, or USB
IMAGE="vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90"
IMAGE_HINT="vllm/vllm-openai:v0.30.0"
MODEL_PATH="$HOME/models/Qwen3.8-Flash-Next-NVFP4-lean"
MODEL_ID="local/Qwen3.8-Flash-Next-NVFP4-lean"
CKPT_SHA256="8eea51eed7872ef5068b446aedc9e851c48a948a09052dbd6957df07c6f401e3"  # shard,size,mtime fingerprint over the 11-shard index, computed on gx10 09-28 04:25 (method = recipes note; NOT content-hash)
CONTAINER="vllm-fn"
PORT=8888
MASTER_PORT=50000

PLE_GIB=47.68
MTP_WEIGHTS_GIB=2.34
KV_CACHE_DTYPE=fp8_e4m3   # needs files/patch_qsa_fp8_kv_v030.py (start.sh wires it)
# 1M context, exactly the old pair's .env contract (YaRN 4.0 x native 262144).
# bf16 KV at 1M REFUSES our budget guard (needs 14.4, leaves 14.3 @TP2 derived)
# — fp8-KV (x0.58) is what makes the 1M row fit on 2x121 GiB with reserve.
MAX_MODEL_LEN=1048576
YARN=1
YARN_FACTOR=4.0
MTP_NUM_SPECULATIVE_TOKENS=4
PLE_MODE=mmap

MEMWATCH_MIN_GIB=3
MEMWATCH_MIN_FREE_GIB=1

VLLM_ARGS="--served-model-name qwen3.8-flash-next --max-num-seqs 32 --max-num-batched-tokens 8192 --load-format safetensors --safetensors-load-strategy lazy --enable-chunked-prefill --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --distributed-executor-backend mp --all2all-backend allgather_reducescatter --quantization modelopt"
NUM_EXPERTS_PER_TOK=6
PLE_EMBEDDING_DTYPE=float8_e4m3fn
HF_OVERRIDES="{\"text_config\": {\"ple_embedding_dtype\": \"$PLE_EMBEDDING_DTYPE\", \"num_experts_per_tok\": $NUM_EXPERTS_PER_TOK}}"
COMPILATION_CONFIG="{\"mode\":0,\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}"
SPECULATIVE_CONFIG="{\"method\":\"mtp\",\"num_speculative_tokens\":4,\"draft_sample_method\":\"probabilistic\",\"rejection_sample_method\":\"block\",\"disable_eagle_block_drop\":true}"
EXTRA_VLLM_ARGS=""
DOCKER_ARGS_EXTRA=""
