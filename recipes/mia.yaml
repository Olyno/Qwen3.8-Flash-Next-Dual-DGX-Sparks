# recipes/mia.yaml — the vendor (MiaAI-Lab) contract: exactly the shipped
# serving defaults, no opinions. Reference recipe; the default boot is
# prod.yaml. Deliberately does NOT pin ablit: a recipe wins over .env, so
# pinning it would stomp the documented ABLIT=1-in-.env workflow — and 0 is
# the engine default anyway.
name: mia
image: vllm/vllm-openai:qwen38-flash-next
model_id: nvidia/Qwen3.8-Flash-Next-NVFP4
served_model_name: qwen3.8-flash-next
max_model_len: 262144
yarn_enable: false
yarn_factor: 4.0
gpu_memory_utilization: 0.80
max_num_seqs: 8
max_num_batched_tokens: 8192
port: 8888
master_port: 50000
kv_cache_dtype: fp8
mamba_ssm_cache_dtype: bfloat16
tensor_parallel_size: 2
enable_expert_parallel: true
mm_encoder_tp_mode: data
mtp_num_speculative_tokens: 3
mtp_draft_vocab: vocab/draft_vocab_en_code_47k.txt
mtp_disable_block_drop: 1
mtp_index_share: true
ple_offload: false
qsa_profile: stock
fp8_dense: false
require_idle_gpu: true
evict_page_cache: true
nfs_share: false
vllm_allow_long_max_model_len: 1
