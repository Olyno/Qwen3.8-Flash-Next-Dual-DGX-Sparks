# recipes/fp8.yaml — FP8-dense hybrid checkpoint (NVFP4 experts + FP8
# per-channel dense projections) on the vLLM v0.32.0 (v030) lane. Same
# vendor serving contract as prod.yaml except checkpoint selection.
#
# Single-node capable: on this lane the PLE mmap offload (derived at NODES=1)
# parks the n-gram table in a file-backed host table, so the ~120 GiB local
# checkpoint fits one Spark at TP=1. mtp_draft_vocab is omitted on purpose:
# the reduced draft head assumes a BF16 draft lm_head and this checkpoint's
# draft head is FP8 (engine/patches.sh refuses the combination). All four
# overlay diffs apply to the plain v0.32.0 stock files (git apply -p2,
# verified against the extracted image layout).
name: fp8
image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
v030: true
skip_ple_patch: true
fp8_dense: true
fp8_dense_model_id: ~/models/q38-lean-hyb
served_model_name: Qwen3.8-Flash-Next-NVFP4
# max_model_len: derived from NODES (65536 at 1 node) — at TP=1 the FP8 dense
# projections leave ~3.8 GiB of KV, short of the 3.92 GiB a 262144-token
# request needs. tensor_parallel_size follows NODES like prod (one GPU per
# Spark); the TP=2 shape is unverified (no dual-node test).
yarn_enable: false
yarn_factor: 4.0
gpu_memory_utilization: 0.72
max_num_batched_tokens: 8192
# The engine caps logprobs at 20 by default, which refuses the p99-KL yardstick's
# 64-wide request. prod.yaml declares the same value for the same reason.
max_logprobs: 64
long_prefill_token_threshold: 4800
port: 8888
master_port: 50000
kv_cache_dtype: fp8
mamba_ssm_cache_dtype: bfloat16
enable_expert_parallel: true
mm_encoder_tp_mode: data
mtp_num_speculative_tokens: 3
mtp_disable_block_drop: 1
mtp_index_share: true
qsa_profile: stock
load_drop_cache: true
require_idle_gpu: true
evict_page_cache: true
nfs_share: false
vllm_allow_long_max_model_len: 1
