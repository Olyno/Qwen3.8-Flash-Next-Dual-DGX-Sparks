# recipes/prod-fr.conf — French-first daily driver: prod.conf + reduced draft
# vocab (65k fr) + greedy drafting. See the MULTILINGUAL DRAFTING note in
# prod.conf for the mechanism, the measured numbers (fr +14 % decode, coverage
# 69 -> 99.5 %), and WHY the drafter must switch to greedy for the slice to
# engage (llm_base_proposer.py:444). Verify stays lossless block rejection.
# Swap in another language by editing the single MTP_DRAFT_VOCAB line
# (files/draft_vocab_{en_code_47k,zh,ja,de,pt,fr,ru}_en_code_65k.txt).
IMAGE="vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90"
IMAGE_HINT="vllm/vllm-openai:v0.30.0"

# Local bench-built checkpoint (lean x hybrid NVFP4+FP8-dense, 120 GiB, built
# + verified 09-27: quant parity q38-hyb, 591 FP8_PER_CHANNEL_PER_TOKEN).
# MODEL_PATH wins over MODEL_ID in start.sh; hub id stays for the sha record.
MODEL_PATH="$HOME/models/q38-lean-hyb"
MODEL_ID="local/q38-lean-hyb"
CKPT_SHA256="29f10c2c7dc6d2a50b4a758432527ed98a3016639695b761183f92770b04ca54"  # fingerprint: sha256 over sorted (shard,size,mtime) of the q38-lean-hyb index, msi 09-27 17:3x (NOT content-hash; see note below)

CONTAINER="vllm-fn-prod-fr"
PORT=8888                 # safe only while comfy-h3.service is disabled
MASTER_PORT=50000

# -- memory shaping (engine/budget.sh) -----------------------------------------
PLE_GIB=47.68             # packed fp8 PLE table size (nvfp4-wk1 lineage)
MTP_WEIGHTS_GIB=2.34      # draft weights credited when MTP off (here: on)
KV_CACHE_DTYPE=fp8_e4m3   # needs files/patch_qsa_fp8_kv_v030.py (PR #55557)
MAX_MODEL_LEN=131072
MTP_NUM_SPECULATIVE_TOKENS=4

# -- PLE + engine deltas (engine/ple.sh, start.sh) ----------------------------
PLE_MODE=mmap             # proven contract: lazy build once, reuse forever
FP8DENSE=1                # hybrid ckpt needs the 3-file overlay (files/*.py)

# -- watchdog -----------------------------------------------------------------
MEMWATCH_MIN_GIB=3
MEMWATCH_MIN_FREE_GIB=1

# -- vLLM args ----------------------------------------------------------------
VLLM_ARGS="--served-model-name qwen3.8-flash-next --max-num-seqs 8 --max-num-batched-tokens 8192 --safetensors-load-strategy lazy --enable-chunked-prefill --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --distributed-executor-backend mp --quantization modelopt"
NUM_EXPERTS_PER_TOK=6
PLE_EMBEDDING_DTYPE=float8_e4m3fn
HF_OVERRIDES="{\"text_config\": {\"ple_embedding_dtype\": \"$PLE_EMBEDDING_DTYPE\", \"num_experts_per_tok\": $NUM_EXPERTS_PER_TOK}}"
COMPILATION_CONFIG="{\"mode\":0,\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}"
# ENGINE LEGALITY (09-27 19:44): k=5 is IMPOSSIBLE with MTP+QSA — the ring
# capacity 4*ceil((4+k)/4)=12 must divide the 16-aligned attention block size
# (3232%12!=0 -> boot-time hard fail). Legal k: <=4, 9..12, 25..28. Product
# uses k=4, the closest legal to the K5 intent; depth-curve evidence for
# k>=5 being pointless anyway (acceptance decays; sister shipped k=3).
# disable_eagle_block_drop: NATIVE in v0.30 (speculative.py:440), TTFT -50 %.
# use_local_argmax_reduction must NOT combine with sampled drafting (PR #71).
SPECULATIVE_CONFIG="{\"method\":\"mtp\",\"num_speculative_tokens\":4,\"draft_sample_method\":\"greedy\",\"rejection_sample_method\":\"block\",\"disable_eagle_block_drop\":true,\"use_local_argmax_reduction\":true}"
# MULTILINGUAL DRAFTING (09-29): the reduced draft vocab (FR-Spec) makes the
# drafter's lm_head sliceable — English+code traffic loses nothing, but zh/ja/
# ru/de/fr/pt prose coverage of the 47k file collapses (fr 69 %). Mia's lab
# shipped per-language 65k files (MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-
# Spark@7d0712d): 47k floor + 668 MiB of that language's Wikipedia, held-out
# coverage fr 99.5 %, measured decode +14 % (fr), +14-16 (de), +10 (pt),
# +35-44 (ja), +36-43 (zh), +63-77 (ru), English ~flat. Files vendored under
# files/. THE CATCH (ours, image-verified): the slice engages only through
# _greedy_sample (llm_base_proposer.py:444, gated by use_local_argmax_reduction)
# — with draft_sample_method=probabilistic the reduced head is never called.
# French (and any non-en) traffic: use recipes/prod-fr.conf, which pairs the
# file with greedy drafting. Verify is still lossless (block rejection), so
# output quality is unaffected; only the draft policy changes.
EXTRA_VLLM_ARGS=""
DOCKER_ARGS_EXTRA=""

# -- the two fr deltas ----------------------------------------------------
MTP_DRAFT_VOCAB=files/draft_vocab_fr_en_code_65k.txt
