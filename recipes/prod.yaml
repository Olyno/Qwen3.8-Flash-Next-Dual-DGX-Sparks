# recipes/prod.yaml — our serving config, and the default boot (RECIPE unset
# -> prod). All new optimizations and deltas land here.
#
# Model: the local checkpoint (marker-penalty thinking suppression baked into the weights — the
# thinking suppression needs no serving-side code). Local dir, bind-mounted
# at /model, never downloaded. vLLM v0.32.0 (v030 lane): PLE handling, the
# block-drop fix and FP8 KV (vllm#55557) are all native — the FP8-KV overlay
# is gone.
#
# Serving shape follows the topology (NODES in .env): at NODES=1 the PLE mmap
# offload parks the ~48 GiB packed n-gram embedding table (16 heads, hashed
# bigram/trigram rows; gathered once per forward at layer 2) in a file-backed
# host table so the model fits at TP=1; at NODES=2 config.sh derives
# ple_offload: false, max_model_len: 262144 (native, no YaRN) and
# max_num_seqs: 8 from the halved
# per-rank footprint. Pin any of them here to override.
#
# (2026-10, measured on GB10): decode is NOT page-fault-bound — the
# side-stream prefetch engages for this mmap path under FULL_DECODE_ONLY
# capture and warm vs verified-cold decode are identical, so no hot-row
# cache. On v0.32 the mmap table rides the class's native supports_prefetch
# (lazy side stream + persistent buffer), so persistence is now
# native-prefetch-plus-restart-skip; the boot probe re-checks it still
# eliminates the ~48 GiB re-gather. vllm#58441 (prefetch reads graph-pool
# ids that later segments reuse) remains a PIECEWISE-only hazard; we run
# FULL_DECODE_ONLY + CompilationMode.NONE — no segment reuse, no port
# needed. #58489's persistent-buffer fix shipped in v0.32.0, so the
# breakable-cudagraph warn-guard came off with it. Remaining PLE pain:
# prefill TTFT under concurrent decode (prefill-time gather is not hidden).
name: prod
image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
v030: true
skip_ple_patch: true
model_path: ~/models/Qwen3.8-Flash-Next-NVFP4-lean
do_download_default: false
served_model_name: Qwen3.8-Flash-Next-NVFP4  # what client tools match on /v1/models
# CoD (Chain-of-Draft) prior baked into the template's default reasoning
# instructions — the chain-of-draft prior, applied to every client.
chat_template: chat_template_cod.jinja
# max_model_len: derived from NODES (65536 at 1 node, native 262144 at 2).
yarn_enable: false
yarn_factor: 4.0
# 0.75 fits the unified-memory pool: ~23 GiB is always held by the host/driver,
# and the budget must cover ~76 GiB on-GPU weights + KV + MTP (0.80 fails the
# startup free-memory check on a desktop-equipped Spark).
# 0.75 leaves the host ~7.5 GiB; under load the driver fails allocations
# (NV_ERR_NO_MEMORY) and memwatch stops the container. 0.72 keeps ~370K
# tokens of KV (prod needs 262K) and ~11 GiB of host headroom.
gpu_memory_utilization: 0.72
# max_num_seqs: derived from NODES (4 at 1 node, 8 at 2).
max_num_batched_tokens: 8192
# Chunk long prefills at 4800: a full-budget 48K prefill spikes ~1.3 GiB in
# one step and trips the memwatch 6 GiB floor (sfxnz runs this on GB10).
long_prefill_token_threshold: 4800
port: 8888
master_port: 50000
kv_cache_dtype: fp8
# STEPQuant (arXiv 2609.38169, INT6 GDN state) assessed and SKIPPED: bf16
# already captures half the state saving; INT6 would free ~7.7 GiB of cache
# pool we cannot fill at max_num_seqs 4/64K, force the decode path off the
# fused CUDA MTP kernel (fp32/bf16 states only), and take 8-15 days of
# Triton + calibration work. Revisit only at sustained high concurrency.
mamba_ssm_cache_dtype: bfloat16
# Prefix caching is stock-ON and already hybrid-aware: align-mode GDN state
# checkpoint/restore plus Marconi-style retention (prefix_cache_retention_
# interval=0 keeps only replay-boundary and shared-prefix-junction
# checkpoints). Marconi (arXiv 2411.19379) assessed and SKIPPED — its delta
# over stock (radix admission + FLOP-per-byte eviction) only pays under
# cache-capacity pressure, which this shape (working set fits the pool)
# never has. Expected gain for our traffic: ~0%.
enable_expert_parallel: true
mm_encoder_tp_mode: data
# Pin the container to the ten 3.9 GHz X925 cores (0-4,10-14 are 2.8 GHz
# A725) — measured +2-3 % at every concurrency in the vendor single-Spark
# recipe; scheduling only, no output change.
cpuset: "5-9,15-19"
mtp_num_speculative_tokens: 4
# A 24k vocab regenerated from fresh model-generated corpus LOST the acceptance
# A/B against this 47k file (copy-task acceptance −20 pts, code −7.5, draft pos 3
# −5 pts): structured/verbatim content needs the coverage the smaller vocab
# drops. Do not shrink below 47k without re-running bench/mtp_accept.py.
mtp_draft_vocab: vocab/draft_vocab_en_code_47k.txt
mtp_index_share: true
mtp_disable_block_drop: 1
# Block verification (Sun et al.) jointly verifies the draft block; lossless
# w.r.t. the target distribution, gated by bench/output_gate.py.
mtp_rejection_sample_method: block
# mtp_skip_prefix: draft-prefill tail-window skip of the drafter's MoE block
# and final HC mixer (patches/patch_mtp_prefix_skip.py; attention stays full
# width for the drafter's KV cache; a first-prefill parity self-check pins
# each stage to stock unless the tail rows are bit-identical). Default OFF —
# boot verification pending (bench/longctx.py TTFT + the parity lines in the
# boot log).
mtp_skip_prefix: false
# ple_offload: derived from NODES (true at 1 node — the n-gram table is
# offloaded so the model fits; false at 2 — halved per-rank weights leave the
# host table out of the loop).
qsa_profile: stock
fp8_dense: false
# The SM12x skinny-GEMM plan table (vllm#59632/#59753, strided-A fix
# vllm#60027) ships in the image; the overlay was dropped with the v0.32
# migration. A plan miss keeps the standard linear path.
# fp8_draft_head: FP8 (E4M3/row-scale) copy of the drafter's lm_head rows
# (~2x less draft-head bandwidth; composes with mtp_draft_vocab).
# Disabled: on the GB10 bench host the attach itself is fully accounted
# (147 MiB transient, 115.3 MiB persistent for the 47,149-row slice, torch
# reserved unchanged), yet enabling it reproducibly crashes KV sizing with
# -3.5..-4.5 GiB where identical stock boots on the same host draw
# +4.7/+5.1/+5.3 GiB (0/4 vs 3/3 same night, same host, interleaved). The
# ~9 GiB delta lands outside torch accounting, in the host-memory release at
# end of weight load (stock boots free ~19 GiB of MemAvailable there, fp8
# boots only ~3-6 GiB); mechanism unidentified. Keep off until root-caused.
fp8_draft_head: false
# SketchSSM (arXiv 2609.33051) and SuffixReplay (arXiv 2609.33477) assessed,
# both SKIPPED: approximate methods that fail the quality bar by design
# (SketchSSM's own table shows −2.4 pts on LiveCodeBench at G=8; SuffixReplay
# −8.6 on RULER), both need the buffered-write substrate that already
# collapsed here, and at batch ≤4 the GDN state read is ≲1% of step time.
# SuffixReplay's gap is also already closed by stock align-mode mamba
# prefix caching (block-granular checkpoints vs SGLang's 8192-token ones).
# Revisit only at batch ≥64.
# gdn_prefill_backend: flashinfer pins the FlashInfer CuTe-DSL GDN prefill
# kernel (vllm#55715, gate widened to SM12x). Measured on GB10 (2026-10-10,
# salted cold-prompt TTFT A/B, verified kernel engaged): NEUTRAL — 8k TTFT
# ~3.4s and 48k ~16.7s both arms, decode unchanged. (An earlier "2x slower"
# reading was host contention from leftover bench processes.) No benefit —
# keep unset (stock auto resolution).
# gdn_prefill_backend: flashinfer
# Pass --async-scheduling explicitly. vLLM 0.32 already resolves it ON for
# MTP + the mp executor, so false changes nothing today; true pins it.
async_scheduling: false
# myllmbox v030 port, default OFF until boot-verified: reuse one QSA
# attention-metadata build across MTP draft steps (vllm#58449 port; needs
# mtp_num_speculative_tokens > 1).
qsa_fused_draft: true
# Clamp pre-indexer RoPE positions into the cos/sin table (fixes a CUDA-graph
# warmup OOB read on SM121).
qsa_rope_clamp: true
# The QKV/gate + indexer projection merge (vllm#59533) is native in v0.32.0:
# one GEMM per attention layer, no overlay, no toggle. Overlay-era A/B on
# this host for reference: 13 (13952,2560) skinny modules (12 QSA + MTP),
# accepted/draft 1.724 -> 1.898 (ref 1.692), decodebench ctx1k/dec500 prose
# ~21.2 / code ~30.9 -> ~35.9 / copy ~60.9 -> ~61.6 tok/s, quality gate
# PASS, +2.2 GiB device (KV 262k -> 153k tokens). The merged plan ships in
# the image table (skinny_gemm.py QWEN4_EXP_SM121_GEMM_PLANS).
# fadvise(DONTNEED) each checkpoint shard as the loader finishes it, keeping
# the page cache one shard deep during the load.
load_drop_cache: true
# Free-list block-id sort (vllm#31371 RFC port, patches/free_block_sort/):
# freed KV blocks go back onto the free list sorted by block_id, so pops hand
# out address-sequential blocks — contiguous ids coalesce into larger DMA
# bursts on KV offload/prefetch. Boot-verified on GB10 (2026-10-10): decodebench
# and MTP acceptance identical to stock (accepted/draft 1.990 vs 1.99),
# quality gate PASS.
free_block_sort: true
# Equal-width chunked prefill (patches/patch_chunk_equal_split.py; idea credit
# Niko1221/Strata (MIT), chunk policy #41): when a prefill has to be split under
# long_prefill_token_threshold, cut ceil(N/cap) equal chunks instead of
# cap-sized chunks plus a stub tail — a 5,000-token prompt at our cap of 4,800
# becomes 2500+2500, not 4800+200. Same cap, same step count, and the tail step
# stops being near-empty (a lone request already skips the cap, so this only
# shows up with two or more eligible requests). Default OFF — boot
# verification pending (bench/longctx.py TTFT at 2+ concurrent prompts, plus a
# scheduler log check that no chunk lands near the 200-row stub size).
chunk_equal_split: false
# spec_trace: measurement-only JSONL of per-round draft alloc/accepted/ms
# (patches/patch_spec_trace.py). Off by default; path via VLLM_SPEC_TRACE.
spec_trace: false
# Adaptive speculative-verify width: per-step draft width (1/2/config k) from the acceptance EMA.
# Lossless: fewer/extra verify rows only; target verification unchanged.
verify_width_adaptive: false
require_idle_gpu: true
evict_page_cache: true
nfs_share: false
vllm_allow_long_max_model_len: 1
