# recipes/prod.yaml — our serving config, and the default boot (RECIPE unset
# -> prod). All new optimizations and deltas land here.
#
# Model: the local checkpoint (P1 marker penalty baked into the weights — the
# thinking suppression needs no serving-side code). Local dir, bind-mounted
# at /model, never downloaded. vLLM 0.30 lane: PLE handling and the
# block-drop fix are native, FP8 KV comes from the v030 backport overlay.
#
# Serving shape targets a single Spark (NODES=1): TP follows the node count,
# and the PLE mmap offload parks ~48 GiB of expert weights in a file-backed
# host table so the model fits at TP=1. Context and concurrency are the
# vendor-validated single-Spark values; raising max_model_len toward the
# native 262144 is a KV-fit sweep, not a config default.
name: prod
image: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
v030: true
skip_ple_patch: true
model_path: ~/models/Qwen3.8-Flash-Next-NVFP4-lean
do_download_default: false
served_model_name: Qwen3.8-Flash-Next-NVFP4  # what client tools match on /v1/models
# CoD (Chain-of-Draft) prior baked into the template's default reasoning
# instructions — the overthinking-lab P2 arm, applied to every client.
chat_template: chat_template_cod.jinja
max_model_len: 65536
yarn_enable: false
yarn_factor: 4.0
# 0.75 fits the unified-memory pool: ~23 GiB is always held by the host/driver,
# and the budget must cover ~76 GiB on-GPU weights + KV + MTP (0.80 fails the
# startup free-memory check on a desktop-equipped Spark).
gpu_memory_utilization: 0.75
max_num_seqs: 4
max_num_batched_tokens: 8192
port: 8888
master_port: 50000
kv_cache_dtype: fp8
mamba_ssm_cache_dtype: bfloat16
enable_expert_parallel: true
mm_encoder_tp_mode: data
mtp_num_speculative_tokens: 4
mtp_draft_vocab: vocab/draft_vocab_en_code_47k.txt
mtp_index_share: true
mtp_disable_block_drop: 1
ple_offload: true
qsa_profile: stock
fp8_dense: false
skinny_gemm: false  # GB10 SM12x skinny-GEMM plan overlay; TP=2-tuned, off until boot-verified
require_idle_gpu: true
evict_page_cache: true
nfs_share: false
vllm_allow_long_max_model_len: 1
