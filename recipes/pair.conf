# recipes/pair.conf — the locked product on the DUAL-Spark pair (gx10 head+worker).
# Same engine/weights as prod.conf (q38-lean-hyb x K6 x MTP k=4 x PLE mmap x
# fp8-KV, v0.30), distinct CONTAINER name and TP=2 by detection. Identity keys
# (HEAD_IP/WORKER_IP/IFACE/IB_*) live in .env, NOT here — they are per-operator.
# Requirements on BOTH nodes, enforced by start.sh's worker preflight:
#   - image present (head ships it via docker save|load on first run)
#   - MODEL_PATH present (head rsyncs it over the fabric on first run)
#   - >=60 GiB free under ~/.cache/vllm (mmap PLE table ~50 + engine cache)
# Container name is the historical pair default: vllm-fn.
IMAGE="vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90"
IMAGE_HINT="vllm/vllm-openai:v0.30.0"
MODEL_PATH="$HOME/models/q38-lean-hyb"
MODEL_ID="local/q38-lean-hyb"
CKPT_SHA256="29f10c2c7dc6d2a50b4a758432527ed98a3016639695b761183f92770b04ca54"
CONTAINER="vllm-fn"
PORT=8888
MASTER_PORT=50000

# -- memory shaping (engine/budget.sh; TP=2 divides weights AND kv_need/rank) --
PLE_GIB=47.68             # packed fp8 PLE table (host-side on both nodes, mmap)
MTP_WEIGHTS_GIB=2.34
KV_CACHE_DTYPE=fp8_e4m3   # needs files/patch_qsa_fp8_kv_v030.py (start.sh wires it)
MAX_MODEL_LEN=131072
MTP_NUM_SPECULATIVE_TOKENS=4
PLE_MODE=mmap
FP8DENSE=1

MEMWATCH_MIN_GIB=3
MEMWATCH_MIN_FREE_GIB=1

# Dual executor contract: old dual start.sh:811-819 shipped mp + --nnodes 2 +
# allgather_reducescatter for EP; --tensor-parallel-size / --node-rank /
# --headless / --master-addr come from start.sh's dual branch, NOT from here.
VLLM_ARGS="--served-model-name qwen3.8-flash-next --max-num-seqs 32 --max-num-batched-tokens 8192 --load-format safetensors --safetensors-load-strategy lazy --enable-chunked-prefill --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --distributed-executor-backend mp --all2all-backend allgather_reducescatter --quantization modelopt"
NUM_EXPERTS_PER_TOK=6
PLE_EMBEDDING_DTYPE=float8_e4m3fn
HF_OVERRIDES="{\"text_config\": {\"ple_embedding_dtype\": \"$PLE_EMBEDDING_DTYPE\", \"num_experts_per_tok\": $NUM_EXPERTS_PER_TOK}}"
COMPILATION_CONFIG="{\"mode\":0,\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}"
SPECULATIVE_CONFIG="{\"method\":\"mtp\",\"num_speculative_tokens\":4,\"draft_sample_method\":\"probabilistic\",\"rejection_sample_method\":\"block\",\"disable_eagle_block_drop\":true}"
EXTRA_VLLM_ARGS=""
DOCKER_ARGS_EXTRA=""

# deep prefill on this 262K seat needs the smaller indexer workspace (see start.sh note)
VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=64
